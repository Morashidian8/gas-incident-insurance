<!doctype html>
<html lang="fa" dir="rtl" data-mode="site" data-other-url="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a8cc3">
<link rel="icon" href="../icons/icon-192.png" type="image/png">
<title>سامانه بیمه حوادث مشترکین گاز</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;800&display=swap">
</head>
<body>
<style>
/* چیدمان: نوار آبی بالا + چاهک روشن با کارت‌های خطی + کاشی‌های تصویری دوتایی + نوار پایین شناور + برگه‌های کشویی */
:root {
  --blue: #3a8cc3;
  --blue-deep: #2b6f9e;
  --blue-tint: #e7f1f9;
  --green: #1f9d57;
  --green-tint: #e4f5ec;
  --orange: #f28a26;
  --orange-tint: #fdf0e2;
  --red: #d9443a;
  --red-tint: #fbe9e7;
  --amber: #b7791f;
  --amber-tint: #fdf4e1;
  --violet: #6d5bd0;
  --violet-tint: #efedfb;

  --canvas: #f3f6f9;
  --well: #e5edf4;
  --card: #ffffff;
  --line: #a6c8e0;
  --hair: #e3eaf0;
  --ink: #1c2733;
  --muted: #6a7b8c;
  --field: #f7fafc;
  --scrim: rgba(17, 28, 40, .45);
  --shadow: 0 10px 30px rgba(30, 60, 90, .12);

  --illo-ink: #22303d;
  --illo-paper: #ffffff;
  --illo-line: #cad8e4;

  --f-body: 'Vazirmatn', Tahoma, 'Segoe UI', sans-serif;
  --f-display: 'Lalezar', 'Vazirmatn', Tahoma, sans-serif;
  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --blue: #4a9bd3; --blue-deep: #2f74a6; --blue-tint: #1a2d3d;
    --green: #3cc07a; --green-tint: #17302a;
    --orange: #f59a45; --orange-tint: #352718;
    --red: #f06a5f; --red-tint: #3a1f1e;
    --amber: #e0a94a; --amber-tint: #33291a;
    --violet: #9d8ff0; --violet-tint: #26233f;
    --canvas: #0e151d; --well: #151f2a; --card: #1a2531; --line: #2f4d66; --hair: #26333f;
    --ink: #e5edf4; --muted: #93a5b6; --field: #121b25; --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 10px 30px rgba(0, 0, 0, .4);
    --illo-ink: #d7e5f1; --illo-paper: #22303e; --illo-line: #3b5165;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --blue: #4a9bd3; --blue-deep: #2f74a6; --blue-tint: #1a2d3d;
  --green: #3cc07a; --green-tint: #17302a;
  --orange: #f59a45; --orange-tint: #352718;
  --red: #f06a5f; --red-tint: #3a1f1e;
  --amber: #e0a94a; --amber-tint: #33291a;
  --violet: #9d8ff0; --violet-tint: #26233f;
  --canvas: #0e151d; --well: #151f2a; --card: #1a2531; --line: #2f4d66; --hair: #26333f;
  --ink: #e5edf4; --muted: #93a5b6; --field: #121b25; --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 10px 30px rgba(0, 0, 0, .4);
  --illo-ink: #d7e5f1; --illo-paper: #22303e; --illo-line: #3b5165;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--canvas); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.75;
  direction: rtl; -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--blue);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--blue) 55%, transparent); outline-offset: 2px; }
.ic { width: 22px; height: 22px; flex: none; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* ---------- نوار بالا ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--blue); color: #fff;
}
.topbar-in {
  max-width: 980px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sq-btn {
  position: relative; width: 46px; height: 46px; border-radius: 12px; border: 0;
  background: #fff; color: var(--blue); display: grid; place-items: center;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .08);
}
.sq-btn .dot {
  position: absolute; top: -5px; left: -5px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
  background: var(--orange); color: #fff; font-size: 12px; line-height: 20px; font-weight: 700;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand b { font-family: var(--f-display); font-weight: 400; font-size: 25px; line-height: 1.2; color: #fff; white-space: nowrap; }
.brand small { display: block; font-size: 11.5px; opacity: .85; line-height: 1.3; white-space: nowrap; }

/* لوگوی سازمان (بارگذاری‌شده توسط مدیر) روی زمینه سفید گرد */
.org-logo { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; overflow: hidden; flex: none; background: #fff; border-radius: 50%; box-shadow: 0 2px 8px rgba(0, 0, 0, .12); }
.org-logo img { width: 100%; height: 100%; min-width: 0; object-fit: contain; display: block; }
.org-name { font-size: 14px; font-weight: 700; opacity: .95; }

/* ---------- بدنه ---------- */
.page {
  max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  padding-block: 16px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page.narrow { max-width: 620px; }
.well { background: var(--well); border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.page-title { display: flex; align-items: center; gap: 10px; }
.page-title h1 { font-size: 20px; }
.page-title .back {
  width: 40px; height: 40px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--blue);
  display: grid; place-items: center; flex: none;
}
.page-title .sub { color: var(--muted); font-size: 13px; }
.section-label { font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .2px; margin: 4px 4px -4px; }

/* کارت خطی تاشو (مثل کارت قرارداد در نمونه) */
.ocard { background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; padding: 6px 18px; }
.ocard-head { display: flex; align-items: center; gap: 10px; padding: 10px 0; width: 100%; background: none; border: 0; text-align: right; }
.ocard-head .ic { color: var(--blue); }
.ocard-head .k { color: var(--blue); font-weight: 700; white-space: nowrap; }
.ocard-head .v { font-weight: 700; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.ocard-head .chev { color: var(--blue); transition: transform .2s; }
.ocard.open .chev { transform: rotate(180deg); }
.ocard-body { border-top: 1px solid var(--hair); }
.kv { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--hair); flex-wrap: wrap; }
.kv:last-child { border-bottom: 0; }
.kv .k { color: var(--blue); min-width: 92px; }
.kv .v { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.kv-row { display: flex; column-gap: 20px; flex-wrap: wrap; }
.kv-row > .kv { flex: 1 1 180px; }

/* نوار مبلغ / وضعیت */
.pill-bar {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--blue); color: #fff; border-radius: 999px; padding: 14px 24px;
}
.pill-bar .amt { font-family: var(--f-display); font-size: 24px; line-height: 1.3; }
.pill-bar.green { background: var(--green); }
.pill-bar.orange { background: var(--orange); }
.pill-bar.red { background: var(--red); }

/* ---------- کاشی‌ها ---------- */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 760px) { .tiles.t3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .tiles.t4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile {
  --c: var(--blue); --t: var(--blue-tint);
  display: flex; flex-direction: column; background: var(--card); border: 1.5px solid var(--line);
  border-radius: 20px; overflow: hidden; text-align: center; padding: 0; position: relative; color: inherit;
}
.tile.green { --c: var(--green); --t: var(--green-tint); border-color: color-mix(in srgb, var(--green) 45%, var(--line)); }
.tile.orange { --c: var(--orange); --t: var(--orange-tint); border-color: color-mix(in srgb, var(--orange) 45%, var(--line)); }
.tile.violet { --c: var(--violet); --t: var(--violet-tint); border-color: color-mix(in srgb, var(--violet) 40%, var(--line)); }
.tile.red { --c: var(--red); --t: var(--red-tint); border-color: color-mix(in srgb, var(--red) 40%, var(--line)); }
.tile-art { padding: 14px 10px 6px; background: var(--card); }
.tile-art .illo { width: 100%; max-width: 150px; height: auto; display: block; margin: 0 auto; }
.tile-body { background: var(--t); padding: 12px 12px 14px; flex: 1; display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
.tile-title { font-family: var(--f-display); color: var(--c); font-size: 21px; line-height: 1.4; }
.tile-sub { font-size: 13px; color: var(--ink); opacity: .8; min-height: 1.6em; }
.tile-btn {
  margin-top: 8px; border: 1.5px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--card) 55%, transparent);
  color: var(--c); border-radius: 14px; padding: 9px; font-size: 17px; font-weight: 700;
}
.tile:hover .tile-btn { background: var(--card); }
.tile .count {
  position: absolute; top: 10px; right: 10px; min-width: 30px; height: 30px; border-radius: 15px; padding: 0 8px;
  background: var(--c); color: #fff; font-weight: 800; line-height: 30px; font-size: 14px;
}
.tile.compact .tile-art { padding: 10px 8px 2px; }
.tile.compact .tile-art .illo { max-width: 110px; }
.tile.compact .tile-title { font-size: 18px; }

/* ---------- فهرست‌های ردیفی (مثل برگه پیام‌رسان) ---------- */
.rows { background: var(--card); border-radius: 20px; border: 1.5px solid var(--line); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 15px 18px; border: 0; background: none;
  border-bottom: 1px solid var(--hair); text-align: right; color: inherit;
}
.row:last-child { border-bottom: 0; }
.row > .ic:first-child { color: var(--blue); width: 26px; height: 26px; }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 700; display: block; overflow-wrap: anywhere; }
.row .s { color: var(--muted); font-size: 13px; display: block; overflow-wrap: anywhere; }
.row .chev { color: var(--blue); }
.row.danger, .row.danger > .ic:first-child { color: var(--red); }
.row.muted .t { color: var(--muted); font-weight: 500; }
button.row:hover { background: color-mix(in srgb, var(--blue-tint) 60%, transparent); }

/* وضعیت */
.badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.badge.neutral { background: var(--well); color: var(--muted); }
.badge.info { background: var(--blue-tint); color: var(--blue-deep); }
.badge.warn { background: var(--amber-tint); color: var(--amber); }
.badge.accent { background: var(--violet-tint); color: var(--violet); }
.badge.ok { background: var(--green-tint); color: var(--green); }
.badge.bad { background: var(--red-tint); color: var(--red); }
:root[data-theme="dark"] .badge.info, :root:not([data-theme="light"]) .badge.info { color: var(--blue); }
.badge.sla { background: var(--well); color: var(--muted); font-weight: 600; }
.badge.sla.over { background: var(--red-tint); color: var(--red); }

/* نوار مراحل */
.stepper { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 12px 0 6px; }
.step { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 11.5px; color: var(--muted); position: relative; }
.step .b { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--well); color: var(--muted); font-weight: 800; z-index: 1; }
.step::before { content: ""; position: absolute; top: 15px; left: 50%; width: calc(100% + 4px); height: 3px; background: var(--hair); }
.step:first-child::before { display: none; }
.step.done .b { background: var(--green); color: #fff; }
.step.done::before, .step.cur::before { background: var(--green); }
.step.cur .b { background: var(--blue); color: #fff; box-shadow: 0 0 0 5px color-mix(in srgb, var(--blue) 22%, transparent); }
.step.cur { color: var(--ink); font-weight: 700; }
.step .b .ic { width: 16px; height: 16px; }

/* هشدار */
.note { border-radius: var(--r-md); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.note .ic { margin-top: 2px; }
.note.warn { background: var(--amber-tint); color: var(--ink); } .note.warn .ic { color: var(--amber); }
.note.bad { background: var(--red-tint); } .note.bad .ic { color: var(--red); }
.note.info { background: var(--blue-tint); } .note.info .ic { color: var(--blue); }
.note.ok { background: var(--green-tint); } .note.ok .ic { color: var(--green); }
.note ul { margin: 4px 0 0; padding-inline-start: 18px; }
.note b { display: block; }

/* ---------- فرم ---------- */
.form { background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld > span { font-size: 13.5px; font-weight: 700; }
.fld > span i { color: var(--red); font-style: normal; }
.fld small { color: var(--muted); font-size: 12px; }
.fld small.err { color: var(--red); }
input[type=text], input[type=password], input[type=tel], input[type=number], input[type=search], select, textarea {
  width: 100%; background: var(--field); border: 1.5px solid var(--hair); border-radius: 12px; padding: 11px 13px; outline: none; min-width: 0;
}
input:focus, select:focus, textarea:focus { border-color: var(--blue); background: var(--card); }
/* ورودی‌های لاتین و عددی (نام کاربری، رمز، شبا، کد ملی): متن چپ‌به‌راست تایپ می‌شود ولی مثل بقیه فرم از راست چیده می‌شود */
input.ltr { direction: ltr; text-align: right; }
input.ltr::placeholder { direction: rtl; text-align: right; }
textarea { resize: vertical; min-height: 92px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; font-size: 13.5px; display: inline-flex; gap: 6px; align-items: center; }
.chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.chip { position: relative; cursor: pointer; }
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.chip:focus-within { outline: 3px solid color-mix(in srgb, var(--blue) 55%, transparent); outline-offset: 2px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--green); flex: none; }

.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  flex: 1; min-width: 130px; border-radius: 16px; padding: 13px 18px; font-weight: 700; font-size: 15.5px;
  border: 1.5px solid var(--blue); background: var(--blue); color: #fff; display: inline-flex; gap: 8px; align-items: center; justify-content: center;
}
.btn.ghost { background: var(--card); color: var(--blue); }
.btn.green { background: var(--green); border-color: var(--green); }
.btn.orange { background: var(--orange); border-color: var(--orange); }
.btn.red { background: var(--red); border-color: var(--red); }
.btn.red.ghost { background: var(--card); color: var(--red); }
.btn.sm { flex: none; min-width: 0; padding: 7px 12px; font-size: 13.5px; border-radius: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn .ic { width: 20px; height: 20px; }
.link { background: none; border: 0; color: var(--blue); font-weight: 700; padding: 0; }

/* جدول اقلام */
.items { display: flex; flex-direction: column; gap: 10px; }
.item-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.2fr) auto; gap: 8px; align-items: end; padding: 10px; background: var(--field); border-radius: 14px; }
.item-row.r4 { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.2fr) minmax(0, 1.2fr) auto; }
@media (max-width: 560px) { .item-row, .item-row.r4 { grid-template-columns: 1fr 1fr; } .item-row .wide { grid-column: 1 / -1; } }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1.5px solid var(--hair); background: var(--card); color: var(--red); display: grid; place-items: center; }
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { padding: 9px 8px; border-bottom: 1px solid var(--hair); text-align: right; white-space: nowrap; }
.tbl th { color: var(--muted); font-weight: 700; font-size: 12.5px; }
.tbl td.n { font-variant-numeric: tabular-nums; }
.tbl input { padding: 7px 9px; min-width: 120px; }
.sumline { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--hair); }
.sumline b { font-variant-numeric: tabular-nums; }
.sumline.total { border: 0; font-size: 17px; color: var(--green); }

/* فایل‌ها و عکس‌ها */
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.thumb { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 14px; overflow: hidden; background: var(--well); border: 1.5px solid var(--hair); padding: 0; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .pdf { display: grid; place-items: center; height: 100%; color: var(--blue); font-size: 11px; padding: 6px; text-align: center; overflow-wrap: anywhere; }
.thumb .rm { position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 9px; background: rgba(0, 0, 0, .55); color: #fff; border: 0; display: grid; place-items: center; }
.thumb .rm .ic { width: 16px; height: 16px; }
.add-file {
  aspect-ratio: 1; max-width: 100%; border-radius: 14px; border: 2px dashed var(--line); color: var(--blue); background: var(--blue-tint);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12.5px; font-weight: 700; cursor: pointer;
}
.add-file input { display: none; }
.doc-card { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.doc-card.flag { border-color: var(--amber); }
.doc-head { display: flex; align-items: center; gap: 10px; }
.doc-head .t { flex: 1; font-weight: 700; min-width: 0; }
.state-dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.state-dot.ok { background: var(--green-tint); color: var(--green); }
.state-dot.miss { background: var(--well); color: var(--muted); }
.state-dot.flag { background: var(--amber-tint); color: var(--amber); }
.state-dot .ic { width: 16px; height: 16px; }

/* نقص‌ها */
.defect { border-radius: 14px; background: var(--amber-tint); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.defect .who { font-size: 12px; color: var(--muted); }
.defect .reply { background: var(--card); border-radius: 10px; padding: 8px 10px; }
.defect.closed { background: var(--well); opacity: .8; }

/* گفتگو */
.thread { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 82%; padding: 10px 14px; border-radius: 18px; background: var(--card); border: 1px solid var(--hair); align-self: flex-start; }
.msg.me { align-self: flex-end; background: var(--blue); color: #fff; border-color: var(--blue); }
.msg.internal { background: var(--violet-tint); border-color: transparent; }
.msg .meta { font-size: 11.5px; opacity: .75; display: block; }
.composer { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { min-height: 48px; }

/* تاریخچه */
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tl li { position: relative; padding: 0 26px 16px 0; }
.tl li::before { content: ""; position: absolute; right: 7px; top: 8px; bottom: -8px; width: 2px; background: var(--hair); }
.tl li:last-child::before { display: none; }
.tl li::after { content: ""; position: absolute; right: 2px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--blue); border: 3px solid var(--card); }
.tl .t { font-weight: 700; }
.tl .s { color: var(--muted); font-size: 12.5px; }
.tl .n { font-size: 13.5px; background: var(--field); border-radius: 10px; padding: 6px 10px; margin-top: 4px; }

/* تب‌ها */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.tab { border: 0; background: var(--card); color: var(--muted); border-radius: 12px; padding: 8px 14px; font-weight: 700; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tab.on { background: var(--blue); color: #fff; }
.tab .ic { width: 18px; height: 18px; }

/* فهرست پرونده‌ها */
.claim-row { display: flex; gap: 12px; align-items: center; width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 12px 14px; text-align: right; color: inherit; }
.claim-row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.claim-row .code { font-weight: 800; direction: ltr; text-align: right; font-variant-numeric: tabular-nums; }
.claim-row .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 13px; }
.claim-row .av { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--blue-tint); color: var(--blue); flex: none; }
.claim-row .av.fire { background: var(--orange-tint); color: var(--orange); }

/* نوار آمار */
.stat-bars { display: flex; flex-direction: column; gap: 10px; }
.sbar { display: grid; grid-template-columns: 150px minmax(0, 1fr) 40px; gap: 10px; align-items: center; font-size: 13.5px; }
.sbar .track { height: 12px; background: var(--well); border-radius: 6px; overflow: hidden; }
.sbar .fill { height: 100%; background: var(--blue); border-radius: 6px; }
@media (max-width: 480px) { .sbar { grid-template-columns: 110px minmax(0, 1fr) 32px; } }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 12px 14px; }
.kpi .l { color: var(--muted); font-size: 12.5px; }
.kpi .v { font-family: var(--f-display); font-size: 22px; color: var(--blue-deep); font-variant-numeric: tabular-nums; }
:root[data-theme="dark"] .kpi .v { color: var(--blue); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .kpi .v { color: var(--blue); } }

/* کارت اعتبارنامه */
.cred { background: var(--green-tint); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.cred .line { display: flex; justify-content: space-between; gap: 10px; align-items: center; background: var(--card); border-radius: 12px; padding: 8px 12px; }
.cred code { font-size: 17px; font-weight: 800; direction: ltr; letter-spacing: .5px; user-select: all; }

/* ---------- نوار پایین ---------- */
.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 25; background: var(--card);
  border-radius: 26px 26px 0 0; box-shadow: 0 -6px 24px rgba(20, 50, 80, .08);
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bottomnav-in { max-width: 620px; margin: 0 auto; display: flex; justify-content: space-around; gap: 6px; }
.nav-btn { position: relative; border: 0; background: none; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 18px; font-weight: 700; font-size: 15px; }
.nav-btn.on { background: var(--blue); color: #fff; }
.nav-btn .ic { width: 24px; height: 24px; }
.nav-btn .dot { position: absolute; top: -4px; right: 50%; min-width: 22px; height: 22px; border-radius: 11px; background: var(--orange); color: #fff; font-size: 12px; line-height: 22px; text-align: center; padding: 0 5px; }
@media (max-width: 420px) { .nav-btn { padding: 10px 12px; font-size: 13.5px; gap: 5px; } .nav-btn:not(.on) .lbl { font-size: 12.5px; } }

/* ---------- برگه کشویی ---------- */
.sheet-scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; animation: fade .2s; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--card); border-radius: 28px 28px 0 0;
  max-height: 88vh; overflow-y: auto; animation: rise .25s ease-out;
  padding-block: 12px calc(22px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet-in { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.grab { width: 90px; height: 8px; border-radius: 4px; background: var(--hair); margin: 0 auto 6px; }
.sheet h2 { text-align: center; font-size: 21px; }
.sheet .lead { text-align: center; color: var(--muted); margin: -6px 0 0; }
.sheet .rows { border: 0; border-radius: 0; }
.radio-card { display: flex; align-items: center; gap: 12px; border: 1.5px solid var(--hair); border-radius: 16px; padding: 16px 18px; width: 100%; background: var(--card); text-align: right; color: var(--muted); }
.radio-card.on { border-color: var(--blue); color: var(--ink); }
.radio-card .rd { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--hair); margin-inline-start: auto; flex: none; display: grid; place-items: center; }
.radio-card.on .rd { border-color: var(--blue); background: var(--blue); box-shadow: inset 0 0 0 5px var(--card); }
.support { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--blue); font-weight: 700; padding-top: 6px; }
.support .av { width: 72px; height: 72px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; box-shadow: 0 0 0 7px var(--blue-tint); }
.support .av .ic { width: 38px; height: 38px; }
.support span.num { user-select: all; color: var(--ink); }
.switch { width: 50px; height: 28px; border-radius: 14px; background: var(--hair); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: right .2s; }
.switch.on { background: var(--blue); }
.switch.on::after { right: 25px; }
.viewer img { width: 100%; border-radius: 14px; }
.faq details { border-bottom: 1px solid var(--hair); padding: 12px 4px; }
.faq summary { font-weight: 700; cursor: pointer; }
.faq p { margin: 6px 0 0; color: var(--muted); }

/* اعلان کوتاه */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--ink); color: var(--card); padding: 10px 18px; border-radius: 14px; font-size: 14px; max-width: calc(100% - 32px);
  box-shadow: var(--shadow); animation: rise .2s;
}
.toast.bad { background: var(--red); color: #fff; }

/* ورود */
.login-hero { background: var(--blue); color: #fff; border-radius: 0 0 36px 36px; padding-block: 34px 70px; text-align: center; }
.login-hero-in { max-width: 620px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.login-hero h1 { font-family: var(--f-display); font-weight: 400; font-size: 32px; line-height: 1.3; }
.login-hero p { margin: 0; opacity: .9; max-width: 44ch; }
.login-card { margin-top: -54px; }
.flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center; font-size: 12.5px; }
.flow div { background: var(--card); border-radius: 14px; padding: 10px 6px; border: 1.5px solid var(--hair); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.flow .ic { color: var(--blue); }
.demo-tag { font-size: 12px; color: var(--muted); text-align: center; }

.empty { text-align: center; color: var(--muted); padding: 26px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty .illo { width: 140px; }
.spacer { flex: 1; }
.hide-sm { }
@media (max-width: 480px) { .hide-sm { display: none; } }

@keyframes rise { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.toast { animation-name: toastIn; }
@keyframes toastIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* پیوند جایگزین زیر فرم ورود اپ */
.alt-link { display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--blue); font-weight: 700; text-decoration: none; padding: 6px; }
.alt-link .ic { width: 18px; height: 18px; }
.btn.ghost-light { background: transparent; border-color: rgba(255, 255, 255, .75); color: #fff; text-decoration: none; }
.btn.ghost-light:hover { background: rgba(255, 255, 255, .14); }

/* کادر گزارش علت حادثه (آتش‌نشانی یا کارشناس رسمی دادگستری) */
.cause-box { border: 2px solid var(--orange); background: var(--orange-tint); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.cause-box.review { border-width: 1.5px; }
.cause-head { display: flex; align-items: center; gap: 8px; color: var(--orange); font-size: 16px; }
.cause-head b { color: var(--ink); }
.cause-head i { color: var(--red); font-style: normal; }
.cause-box p { margin: 0; font-size: 14px; }
.cause-box ul { margin: 0; padding-inline-start: 18px; font-size: 13.5px; color: var(--ink); display: flex; flex-direction: column; gap: 3px; }
.cause-box .check { background: var(--card); border-radius: 12px; padding: 10px 12px; }
.cause-box small { color: var(--muted); }
.doc-hint { margin: 0; display: flex; gap: 8px; align-items: flex-start; background: var(--orange-tint); border-radius: 12px; padding: 8px 10px; font-size: 13px; }
.doc-hint .ic { width: 18px; height: 18px; color: var(--orange); flex: none; margin-top: 2px; }

/* ================= پنل مالی (از قبول مبلغ تا واریز) ================= */
.ok-txt { color: var(--green); display: inline-flex; gap: 4px; align-items: center; }
.ok-txt .ic { width: 16px; height: 16px; }
.note.as-link { width: 100%; border: 0; text-align: right; cursor: pointer; color: inherit; align-items: center; }
.note.as-link > div { flex: 1; }
.note.as-link .chev { color: var(--blue); }
.fin-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.fin-head h2 { font-size: 17px; display: flex; gap: 8px; align-items: center; }
.fin-head h2 .ic { color: var(--blue); }
.fin-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fin-sum > div { background: var(--field); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fin-sum span { font-size: 12px; color: var(--muted); }
.fin-sum b { font-size: 14.5px; overflow-wrap: anywhere; }
@media (max-width: 480px) { .fin-sum { grid-template-columns: 1fr; } }
.fin-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.fin-steps li { position: relative; display: flex; gap: 12px; padding-bottom: 16px; }
.fin-steps li::before { content: ""; position: absolute; right: 15px; top: 34px; bottom: 0; width: 2px; background: var(--hair); }
.fin-steps li:last-child { padding-bottom: 0; }
.fin-steps li:last-child::before { display: none; }
.fin-steps li.done::before { background: var(--green); }
.fin-dot { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 800; font-size: 14px; background: var(--well); color: var(--muted); z-index: 1; }
.fin-dot .ic { width: 17px; height: 17px; }
.fin-steps li.done .fin-dot { background: var(--green); color: #fff; }
.fin-steps li.on .fin-dot { background: var(--ember, #f26b21); color: #fff; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(242, 107, 33, .45); } 100% { box-shadow: 0 0 0 12px rgba(242, 107, 33, 0); } }
.fin-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.fin-steps li.todo .fin-body b { color: var(--muted); }
.fin-body .muted { font-size: 13px; }
.fin-kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 4px 0 0; background: var(--field); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.fin-kv dt { color: var(--muted); }
.fin-kv dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.receipt { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border: 2px dashed var(--green); border-radius: 16px; padding: 12px 14px; background: var(--green-tint); }
.receipt > div { display: flex; gap: 8px; align-items: center; color: var(--green); }

/* ================= نسخه سایت =================
   چیدمان: سرصفحه سرمه‌ای چسبان؛ قهرمان تیره با درخشش شعله آبی گاز و نارنجی اخگر؛
   نوار روشن «مسیر پرونده» با موشن‌گرافی؛ کاشی‌های مدارک رنگی؛ پرسش‌ها دوستونه؛ پاصفحه سرمه‌ای. */
:root {
  --navy: #0b2340;
  --navy-2: #123a63;
  --ember: #f26b21;
  --ember-2: #ff8f3f;
  --sky: #5fb3ec;
  --site-ink-light: #e8f1fa;
}
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
:root[data-mode="site"] body::before { background: var(--navy); }
:root[data-mode="site"] .page { max-width: 1180px; padding-block-end: 48px; }
:root[data-mode="site"] .page.narrow { max-width: 860px; }
:root[data-mode="site"] .pill-bar:not(.green):not(.orange):not(.red) { background: linear-gradient(110deg, var(--navy), var(--navy-2) 60%, #1d5d93); }

.eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; letter-spacing: .3px; color: var(--ember); }
.eyebrow.light { color: var(--ember-2); }
.btn.ember { background: var(--ember); border-color: var(--ember); color: #fff; text-decoration: none; box-shadow: 0 8px 22px rgba(242, 107, 33, .35); }
.btn.ember:hover { background: #e05d15; }
.btn.ghost-light { background: transparent; border-color: rgba(255, 255, 255, .55); color: #fff; text-decoration: none; }
.btn.ghost-light:hover { background: rgba(255, 255, 255, .1); }
.alt-link { display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--blue); font-weight: 700; text-decoration: none; padding: 6px; }
.alt-link .ic { width: 18px; height: 18px; }
.link.forgot { align-self: flex-start; display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; margin-top: -4px; }
.link.forgot .ic { width: 17px; height: 17px; }
.muted { color: var(--muted); }
.form.flat { border: 0; padding: 0; }
.otp { font-size: 24px; letter-spacing: 10px; text-align: center !important; font-variant-numeric: tabular-nums; }
.otp-left { font-size: 13px; color: var(--muted); text-align: center; }
.otp-left.over { color: var(--red); font-weight: 700; }
.sms-demo { display: flex; gap: 10px; background: var(--green-tint); border-radius: 14px; padding: 10px 12px; font-size: 13.5px; }
.sms-demo .ic { color: var(--green); }
.sms-demo b { display: block; font-size: 12px; color: var(--green); }

/* سرصفحه */
.site-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--navy); color: #fff; box-shadow: 0 1px 0 rgba(255, 255, 255, .06); }
.site-head-in {
  max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.site-head .brand b { font-size: 21px; }
.site-nav { display: flex; gap: 2px; flex: 1; justify-content: center; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.site-link {
  position: relative; display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: rgba(255, 255, 255, .82);
  padding: 9px 14px; border-radius: 12px; font-weight: 700; font-size: 14.5px; text-decoration: none; white-space: nowrap;
}
.site-link:hover { color: #fff; background: rgba(255, 255, 255, .08); }
.site-link.on { color: #fff; background: rgba(255, 255, 255, .1); }
.site-link.on::after { content: ""; position: absolute; inset: auto 14px 3px; height: 3px; border-radius: 3px; background: var(--ember); }
.site-link .ic { width: 20px; height: 20px; }
.site-link .dot { min-width: 20px; height: 20px; border-radius: 10px; background: var(--ember); color: #fff; font-size: 12px; line-height: 20px; text-align: center; padding: 0 5px; }
.site-tools { display: flex; gap: 8px; align-items: center; }
.site-tools .sq-btn { width: 42px; height: 42px; background: rgba(255, 255, 255, .1); color: #fff; box-shadow: none; }
.site-tools .sq-btn:hover { background: rgba(255, 255, 255, .18); }
@media (max-width: 860px) {
  .site-nav { order: 3; flex-basis: 100%; justify-content: flex-start; }
  .site-tools { margin-inline-start: auto; }
  .site-head .brand small { display: none; }
}

/* قهرمان */
.hero { position: relative; overflow: hidden; background: var(--navy); color: var(--site-ink-light); }
.hero::before {
  content: ""; position: absolute; inset: 0; opacity: .5; pointer-events: none;
  background-image: linear-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .05) 1px, transparent 1px);
  background-size: 44px 44px; mask-image: radial-gradient(ellipse at 70% 40%, #000 20%, transparent 75%);
}
.hero-glow { position: absolute; inset: 0; pointer-events: none; }
.hero-glow::before, .hero-glow::after { content: ""; position: absolute; border-radius: 50%; filter: blur(60px); }
.hero-glow::before { width: 520px; height: 520px; top: -180px; right: -120px; background: radial-gradient(circle, rgba(76, 143, 232, .55), transparent 65%); animation: drift 14s ease-in-out infinite alternate; }
.hero-glow::after { width: 420px; height: 420px; bottom: -200px; left: 8%; background: radial-gradient(circle, rgba(242, 107, 33, .45), transparent 65%); animation: drift 18s ease-in-out infinite alternate-reverse; }
@keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(-40px, 30px) scale(1.12); } }
.hero-grid { position: relative; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 48px; align-items: center; padding-block: 56px 72px; }
@media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; gap: 28px; padding-block: 32px 44px; } }
.hero-copy { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; min-width: 0; }
.hero-copy h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(32px, 4.6vw, 54px); line-height: 1.3; color: #fff; }
.hero-copy h1 em { font-style: normal; color: var(--ember-2); position: relative; white-space: nowrap; }
.hero-copy h1 em::after { content: ""; position: absolute; inset: auto 0 .06em; height: .14em; border-radius: 1em; background: var(--ember); opacity: .45; }
.hero-copy p { margin: 0; max-width: 52ch; font-size: 16.5px; opacity: .85; }
.hero-facts { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
.hero-facts li { display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .12); border-radius: 14px; padding: 8px 14px 8px 12px; }
.hero-facts b { font-family: var(--f-display); font-weight: 400; font-size: 24px; color: var(--sky); display: grid; place-items: center; line-height: 1; }
.hero-facts b .ic { width: 24px; height: 24px; }
.hero-facts span { font-size: 13.5px; font-weight: 700; }
.hero-cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.hero-cta .btn { flex: none; }
.glass { background: var(--card); color: var(--ink); border-radius: 26px; padding: 22px; box-shadow: 0 30px 70px rgba(0, 0, 0, .35); display: flex; flex-direction: column; gap: 6px; position: relative; }
.glass::before { content: ""; position: absolute; inset: -1px; border-radius: 27px; padding: 1px; background: linear-gradient(140deg, var(--ember), transparent 40%, var(--sky)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.glass h2 { font-size: 19px; }
.glass .form { border: 0; padding: 0; }

/* بخش‌ها */
.band { background: linear-gradient(180deg, var(--card), var(--canvas)); border-bottom: 1px solid var(--hair); }
.sec { padding-block: 56px 8px; display: flex; flex-direction: column; gap: 20px; scroll-margin-top: 80px; }
.sec-head { display: flex; flex-direction: column; gap: 6px; max-width: 640px; }
.sec-head h2, .j-head h2, .faq-aside h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 3vw, 34px); line-height: 1.35; color: var(--ink); }
.sec-head p, .j-head p { margin: 0; color: var(--muted); }
.doc-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1000px) { .doc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 540px) { .doc-grid { grid-template-columns: 1fr; } }
.doc-tile { --c: var(--blue); background: var(--card); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--hair); box-shadow: 0 10px 30px rgba(12, 35, 64, .06); transition: transform .2s, box-shadow .2s; }
.doc-tile:hover { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(12, 35, 64, .12); }
.doc-tile.ember { --c: var(--ember); } .doc-tile.violet { --c: var(--violet); } .doc-tile.green { --c: var(--green); }
.doc-ic { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; color: #fff; background: var(--c); box-shadow: 0 8px 18px color-mix(in srgb, var(--c) 35%, transparent); }
.doc-ic .ic { width: 26px; height: 26px; }
.doc-tile h3 { font-size: 17px; }
.doc-tile ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; font-size: 14px; }
.doc-tile li { display: flex; gap: 8px; align-items: flex-start; }
.doc-tile li .ic { width: 17px; height: 17px; color: var(--c); margin-top: 4px; }
.warn-line { display: flex; gap: 8px; align-items: center; margin: 0; color: var(--amber); font-weight: 700; font-size: 14px; }

.faq-split { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .faq-split { grid-template-columns: 1fr; } }
.faq-aside { background: var(--navy); color: var(--site-ink-light); border-radius: 26px; padding: 28px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
.faq-aside::after { content: ""; position: absolute; width: 260px; height: 260px; left: -80px; bottom: -120px; border-radius: 50%; background: radial-gradient(circle, rgba(242, 107, 33, .4), transparent 65%); }
.faq-aside h2 { color: #fff; }
.faq-aside p { margin: 0; opacity: .8; }
.sos { display: flex; gap: 12px; align-items: center; margin-top: 10px; position: relative; z-index: 1; }
.sos > span { width: 50px; height: 50px; border-radius: 16px; background: var(--ember); display: grid; place-items: center; color: #fff; }
.sos b { display: block; font-size: 13px; opacity: .8; }
.sos .num { font-family: var(--f-display); font-size: 30px; line-height: 1.1; color: #fff; }
.faq-list { background: var(--card); border-radius: 22px; border: 1px solid var(--hair); padding: 6px 20px; }
.faq-list details { border-bottom: 1px solid var(--hair); padding: 14px 0; }
.faq-list details:last-child { border-bottom: 0; }
.faq-list summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 700; cursor: pointer; }
.faq-list summary::-webkit-details-marker { display: none; }
.faq-list summary .ic { color: var(--ember); transition: transform .2s; flex: none; }
.faq-list details[open] summary .ic { transform: rotate(180deg); }
.faq-list p { margin: 8px 0 0; color: var(--muted); }
.land-demo { padding-block-end: 40px; }
:root[data-mode="site"] .land-demo .rows { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
:root[data-mode="site"] .land-demo .row { border-bottom: 1px solid var(--hair); border-inline-start: 1px solid var(--hair); }
@media (max-width: 860px) { :root[data-mode="site"] .land-demo .rows { grid-template-columns: 1fr; } :root[data-mode="site"] .land-demo .row { border-inline-start: 0; } }

/* فاصله زیر برچسب شناور مرحله فعال در گوشی */
@media (max-width: 640px) { .j-track { padding-bottom: 26px; } }

/* پاصفحه */
.site-foot { background: var(--navy); color: var(--site-ink-light); margin-top: 40px; }
.site-foot-in {
  max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 24px 40px;
  padding-block: 36px 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (max-width: 760px) { .site-foot-in { grid-template-columns: 1fr; } }
.foot-brand { display: flex; gap: 12px; align-items: center; }
.foot-brand b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 20px; color: #fff; }
.foot-brand span { font-size: 13.5px; opacity: .75; }
.foot-col { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.foot-col > b { color: #fff; }
.foot-col span { opacity: .75; }
.foot-big { font-family: var(--f-display); font-size: 34px; line-height: 1.1; color: var(--ember-2); opacity: 1 !important; }
.foot-col a { color: var(--site-ink-light); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; opacity: .85; }
.foot-col a:hover { opacity: 1; color: #fff; }
.foot-col a .ic { width: 18px; height: 18px; }
.foot-note { max-width: 1180px; margin: 0 auto; font-size: 12.5px; opacity: .55; border-top: 1px solid rgba(255, 255, 255, .1);
  padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ================= موشن‌گرافی مسیر پرونده ================= */
.journey { --j-ms: 4200ms; max-width: 1180px; margin: 0 auto; padding-block: 48px 40px; display: flex; flex-direction: column; gap: 26px; scroll-margin-top: 70px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.journey.compact { padding: 0; gap: 16px; }
.j-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.j-head > div { display: flex; flex-direction: column; gap: 6px; }
.j-track { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); padding-top: 40px; }
.j-rail { position: absolute; top: 64px; inset-inline: calc(100% / var(--n) / 2); height: 6px; border-radius: 6px; background: var(--hair); overflow: hidden; }
.j-fill { height: 100%; width: calc(var(--p) * 100%); border-radius: 6px; background: linear-gradient(270deg, var(--blue), var(--green) 55%, var(--ember)); transition: width .9s cubic-bezier(.65, 0, .35, 1); }
.j-token {
  position: absolute; top: 0; z-index: 2; width: 34px; height: 34px; border-radius: 11px; background: var(--ember); color: #fff; display: grid; place-items: center;
  right: calc(100% / var(--n) / 2 + (100% - 100% / var(--n)) * var(--p)); transform: translateX(50%);
  transition: right .9s cubic-bezier(.65, 0, .35, 1); box-shadow: 0 8px 18px rgba(242, 107, 33, .45); animation: bob 1.6s ease-in-out infinite;
}
.j-token .ic { width: 20px; height: 20px; }
@keyframes bob { 50% { margin-top: -5px; } }
.j-st { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: 0; padding: 0 4px; color: var(--muted); text-align: center; }
.j-dot { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 18px; background: var(--card); border: 3px solid var(--hair); color: var(--muted); transition: all .4s; }
.j-lbl { font-size: 13px; font-weight: 700; line-height: 1.5; transition: color .4s; }
.j-st.done .j-dot { border-color: var(--green); color: var(--green); }
.j-st.on .j-dot { border-color: var(--ember); background: var(--ember); color: #fff; transform: scale(1.12); box-shadow: 0 0 0 8px color-mix(in srgb, var(--ember) 18%, transparent); }
.j-st.on .j-lbl { color: var(--ink); }
.j-st:hover .j-dot { border-color: var(--blue); }
.journey.compact .j-dot { width: 40px; height: 40px; font-size: 15px; }
.journey.compact .j-track { padding-top: 34px; }
.journey.compact .j-rail { top: 51px; }
.journey.compact .j-token { top: 0; width: 28px; height: 28px; }
@media (max-width: 640px) {
  .j-dot { width: 40px; height: 40px; font-size: 15px; }
  .j-track { padding-top: 34px; }
  .j-rail { top: 51px; }
  .j-token { top: 0; width: 28px; height: 28px; }
  .j-lbl { display: none; }
  .j-st.on .j-lbl { display: block; position: absolute; top: 46px; white-space: nowrap; font-size: 12px; }
}
.journey.compact .j-lbl { display: none; }
.j-stage { display: grid; }
.j-card {
  grid-area: 1 / 1; display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 28px; align-items: center;
  background: var(--card); border-radius: 26px; padding: 24px 28px; border: 1px solid var(--hair); box-shadow: 0 18px 44px rgba(12, 35, 64, .08);
  opacity: 0; visibility: hidden; transform: translateY(14px); transition: opacity .5s, transform .5s, visibility 0s .5s;
}
.j-card.on { opacity: 1; visibility: visible; transform: none; transition: opacity .5s .15s, transform .5s .15s; }
.j-card.on .j-art .illo { animation: pop .7s .2s both; }
@keyframes pop { from { transform: scale(.8) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }
.j-art { background: radial-gradient(circle at 50% 60%, var(--blue-tint), transparent 70%); border-radius: 20px; padding: 10px; }
.j-art .illo { width: 100%; max-width: 240px; height: auto; display: block; margin: 0 auto; }
.j-txt { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; min-width: 0; }
.j-txt h3 { font-size: 22px; display: flex; gap: 10px; align-items: center; }
.j-txt h3 .num { width: 34px; height: 34px; border-radius: 10px; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: 16px; flex: none; }
.j-txt p { margin: 0; color: var(--muted); font-size: 15px; max-width: 60ch; }
.j-who { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; font-weight: 800; color: var(--blue-deep); background: var(--blue-tint); border-radius: 999px; padding: 3px 12px; }
.j-who .ic { width: 16px; height: 16px; }
.j-when { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; font-weight: 700; color: var(--ember); }
.j-when .ic { width: 18px; height: 18px; }
.j-loop { display: flex; gap: 10px; align-items: center; background: var(--amber-tint); color: var(--amber); border-radius: 14px; padding: 8px 12px; font-size: 13.5px; font-weight: 700; }
.j-loop svg { width: 54px; flex: none; }
.j-card.on .j-loop path:first-child { animation: dash 1.2s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -20; } }
.journey.compact .j-card { grid-template-columns: 1fr; gap: 10px; padding: 16px; box-shadow: none; }
.journey.compact .j-art .illo { max-width: 150px; }
@media (max-width: 700px) { .j-card { grid-template-columns: 1fr; gap: 12px; padding: 18px; } .j-art .illo { max-width: 170px; } }
.j-ctrl { display: flex; gap: 8px; align-items: center; justify-content: center; }
.j-btn { width: 42px; height: 42px; border-radius: 13px; border: 1px solid var(--hair); background: var(--card); color: var(--ink); display: grid; place-items: center; }
.j-btn:hover { border-color: var(--blue); color: var(--blue); }
.j-btn.play .ic:last-child, .journey[data-play="0"] .j-btn.play .ic:first-child { display: none; }
.journey[data-play="0"] .j-btn.play .ic:last-child { display: block; }
.j-timer { width: 120px; height: 4px; border-radius: 4px; background: var(--hair); overflow: hidden; }
.j-timer span { display: block; height: 100%; width: 0; background: var(--ember); }
.j-timer span.run { animation: fillbar var(--j-ms) linear forwards; }
@keyframes fillbar { to { width: 100%; } }

/* در سایت روی صفحه‌های پهن، برگه‌های کشویی پنجره وسط صفحه‌اند */
@media (min-width: 760px) {
  :root[data-mode="site"] .sheet {
    left: 50%; right: auto; top: 50%; bottom: auto; width: min(600px, calc(100vw - 48px)); max-height: 86vh;
    transform: translate(-50%, -50%); border-radius: 24px; padding-block: 20px; animation: fade .2s;
  }
  :root[data-mode="site"] .sheet .grab { display: none; }
  :root[data-mode="site"] .toast { bottom: 24px; }
}

/* ================= بیمه آتش‌سوزی (صفحه ورود) ================= */
.fire-cta { display: flex; align-items: center; gap: 12px; width: 100%; text-align: right; border: 0; cursor: pointer; border-radius: 18px; padding: 14px 16px; color: #fff; font: inherit;
  background: linear-gradient(135deg, #f26b21, #d9443a); box-shadow: 0 10px 24px rgba(217, 68, 58, .28); }
.fire-cta .fc-ic { width: 46px; height: 46px; border-radius: 14px; background: rgba(255, 255, 255, .18); display: grid; place-items: center; flex: none; }
.fire-cta .fc-ic svg { width: 26px; height: 26px; }
.fire-cta .fc-t { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.fire-cta .fc-t b { font-size: 15.5px; }
.fire-cta .fc-t small { font-size: 12.5px; opacity: .92; }
.fire-cta .chev { opacity: .9; }
.fire-cta:hover { filter: brightness(1.05); }
.fire-cta:focus-visible { outline: 3px solid color-mix(in srgb, #f26b21 60%, transparent); outline-offset: 3px; }
.hero-login .fire-cta { margin-top: 14px; }
.offers { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px 12px; padding-top: 6px; }
.offer { --c: var(--blue); position: relative; display: flex; flex-direction: column; gap: 6px; text-align: right; text-decoration: none; color: var(--ink); font: inherit; cursor: pointer;
  background: var(--card); border: 2px solid color-mix(in srgb, var(--c) 45%, var(--hair)); border-radius: 18px; padding: 16px 14px 14px; }
.offer.t1 { --c: var(--orange); }
.offer.t2 { --c: var(--green); }
.offer:hover { border-color: var(--c); transform: translateY(-2px); transition: transform .15s; }
.offer .of-tier { position: absolute; top: -11px; right: 14px; background: var(--c); color: #fff; font-size: 12px; font-weight: 700; padding: 2px 12px; border-radius: 999px; }
.offer .of-ins { display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--c); font-size: 14px; }
.offer .of-ins svg { width: 18px; height: 18px; }
.offer .of-plan { font-size: 13.5px; color: var(--muted); }
.offer .of-price { font-family: var(--f-display); font-size: 18px; color: var(--ink); }
.offer .of-cover { font-size: 12.5px; line-height: 1.8; color: var(--muted); flex: 1; }
.offer .of-go { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 4px; padding: 9px; border-radius: 12px; background: var(--c); color: #fff; font-weight: 700; font-size: 13.5px; }
.offer .of-go svg { width: 16px; height: 16px; }
.offer.off .of-go { background: var(--well); color: var(--muted); font-weight: 500; }
.offer-set { border: 1.5px solid var(--hair); border-radius: 16px; padding: 10px 14px 14px; margin: 0; }
.offer-set legend { font-weight: 700; padding: 0 6px; color: var(--blue-deep); }
.hint-s { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12.5px; margin: 0; }
.hint-s svg { width: 16px; height: 16px; flex: none; }
.muted-s { color: var(--muted); font-size: 12.5px; margin: 2px 0 0; }

/* ================= گزارش‌ها و داشبورد ================= */
.dash-link { display: flex; align-items: center; gap: 12px; width: 100%; text-align: right; font: inherit; color: var(--ink); cursor: pointer; margin: 4px 0 6px;
  background: linear-gradient(135deg, var(--violet-tint), var(--blue-tint)); border: 1.5px solid color-mix(in srgb, var(--violet) 35%, var(--hair)); border-radius: 18px; padding: 12px 14px; }
.dash-link .dl-ic { width: 42px; height: 42px; border-radius: 13px; background: var(--violet); color: #fff; display: grid; place-items: center; flex: none; }
.dash-link .dl-t { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.dash-link .dl-t small { color: var(--muted); font-size: 12.5px; }
.rep-card { background: var(--card); border: 1.5px solid var(--hair); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px; }
.rep-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.rep-head h2 { font-size: 17px; margin: 0; display: flex; align-items: center; gap: 8px; }
.rep-head h2 svg { width: 22px; height: 22px; color: var(--blue); }
.rep-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rep-tools .sel { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.rep-tools select { font: inherit; padding: 6px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--field); color: var(--ink); }
.live-at { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; margin: 4px 0 0; }
.live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 color-mix(in srgb, var(--green) 60%, transparent); animation: livepulse 1.8s infinite; }
@keyframes livepulse { 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
.big-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.bk { --c: var(--blue); display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 16px; background: color-mix(in srgb, var(--c) 9%, var(--card)); border: 1.5px solid color-mix(in srgb, var(--c) 30%, transparent); }
.bk.violet { --c: var(--violet); } .bk.warn { --c: var(--orange); } .bk.ok { --c: var(--green); }
.bk .ic { color: var(--c); } .bk .ic svg { width: 22px; height: 22px; }
.bk .v { font-family: var(--f-display); font-size: 30px; line-height: 1.2; color: var(--c); }
.bk .l { font-weight: 700; font-size: 13px; }
.bk .p { font-size: 12px; color: var(--muted); }
.rep-sum { margin: 0; line-height: 2; font-size: 14px; background: var(--well); border-radius: 14px; padding: 10px 14px; }
.t-neutral { --c: #8a99a8; } .t-info { --c: var(--blue); } .t-violet { --c: var(--violet); } .t-warn { --c: var(--orange); }
.t-accent { --c: var(--amber); } .t-accent2 { --c: #0f9b96; } .t-ok { --c: var(--green); } .t-bad { --c: var(--red); }
.stack { display: flex; height: 16px; border-radius: 8px; overflow: hidden; gap: 2px; background: var(--well); }
.stack .seg { background: var(--c); min-width: 4px; }
.live-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.lg { position: relative; display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "sw n p" "l l l" "s s s"; align-items: center; gap: 2px 8px; text-align: right; font: inherit; color: var(--ink); cursor: pointer;
  background: var(--card); border: 1.5px solid var(--hair); border-radius: 14px; padding: 10px 12px; }
.lg .sw { grid-area: sw; width: 12px; height: 12px; border-radius: 4px; background: var(--c); }
.lg .n { grid-area: n; font-family: var(--f-display); font-size: 22px; }
.lg .p { grid-area: p; font-size: 12px; color: var(--muted); }
.lg .l { grid-area: l; font-weight: 700; font-size: 13px; }
.lg .s { grid-area: s; font-size: 11.5px; color: var(--muted); }
.lg:hover { border-color: var(--c); }
.lg.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, var(--card)); box-shadow: inset 0 0 0 1px var(--c); }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1.5px solid var(--hair); border-radius: 14px; }
.mtx, .ctbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.mtx th, .mtx td, .ctbl th, .ctbl td { padding: 6px 8px; border-bottom: 1px solid var(--hair); text-align: center; white-space: nowrap; }
.mtx thead th, .ctbl thead th { background: var(--well); font-weight: 700; font-size: 12.5px; position: sticky; top: 0; }
.mtx tbody th { text-align: right; }
.mtx tr.on { background: var(--blue-tint); }
.mtx tfoot th, .mtx tfoot td { background: var(--well); font-weight: 700; border-bottom: 0; }
.mtx .tot { background: color-mix(in srgb, var(--well) 60%, transparent); }
.mname { border: 0; background: none; font: inherit; color: var(--blue-deep); cursor: pointer; padding: 2px 0; font-weight: 600; }
.cell { --h: 0; min-width: 38px; padding: 5px 6px; border-radius: 9px; border: 1.5px solid transparent; font: inherit; font-variant-numeric: tabular-nums; cursor: pointer; color: var(--ink);
  background: color-mix(in srgb, var(--orange) calc(var(--h) * 55%), var(--card)); }
.cell:disabled { cursor: default; color: var(--muted); background: transparent; }
.cell:not(:disabled):hover { border-color: var(--orange); }
.cell.on { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue); font-weight: 700; }
.sel-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--blue-tint); border-radius: 14px; padding: 10px 14px; }
.sel-bar > div:first-child { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.sel-bar .num { color: var(--blue-deep); font-weight: 700; }
.ctbl td { text-align: right; }
.ctbl td.acts { display: flex; gap: 6px; justify-content: flex-end; }
.ctbl tbody tr:hover { background: var(--canvas); }
.tbl-title { font-size: 14.5px; margin: 0; }
@media (max-width: 760px) {
  .big-kpis, .live-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bk .v { font-size: 25px; }
  .rep-card { padding: 12px; border-radius: 18px; }
  .mtx th, .mtx td { padding: 5px 3px; }
  .mtx thead th { font-size: 11.5px; }
}

/* ================= گزارش چاپی ================= */
#printdoc { position: fixed; inset: 0; z-index: 80; background: #fff; overflow: auto; color: #1c2733; }
#printdoc .pd-bar { position: sticky; top: 0; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 10px; background: #f3f6f9; border-bottom: 1px solid #cad8e4; z-index: 1; }
body.has-printdoc { overflow: hidden; }
@media print {
  body.has-printdoc > *:not(#printdoc) { display: none !important; }
  body.has-printdoc #printdoc { position: static; overflow: visible; }
  #printdoc .pd-bar { display: none; }
}
