name: انتشار اپ روی GitHub Pages

# با هر push روی main، تست‌ها اجرا، نسخه قابل نصب با لوگوی سازمان و افزونه وردپرس ساخته
# و روی GitHub Pages منتشر می‌شود. نشانی: https://<owner>.github.io/<repo>/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - name: تست‌ها و بررسی نحو افزونه وردپرس
        run: |
          php wordpress/tests/workflow-test.php
          for f in $(find wordpress -name '*.php'); do php -l "$f" > /dev/null || exit 1; done
      - run: python3 tools/build_single.py --logo assets/logo.png --org "شرکت ملی گاز ایران"
      # افزونه و blueprint آزمایش در WordPress Playground زیر /wp/ منتشر می‌شود
      - run: python3 tools/build_wp.py --logo assets/logo.png --org "شرکت ملی گاز ایران"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pwa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
